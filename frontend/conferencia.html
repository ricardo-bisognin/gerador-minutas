<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Conferência de documentos</title><style>body{font-family:Arial,sans-serif;background:#f4f4f2;color:#222;margin:0}.wrap{max-width:1000px;margin:36px auto;padding:0 20px}.card{background:#fff;border:1px solid #ddd;border-radius:6px;padding:24px;margin:16px 0}.item{border:1px solid #ddd;border-radius:5px;padding:16px;margin:12px 0}.ok{border-left:5px solid #39875b}.warn{border-left:5px solid #d29b00}.bad{border-left:5px solid #c74b4b}.meta{font-size:13px;color:#666}.row{display:grid;grid-template-columns:180px 1fr;gap:12px;margin:8px 0}button{padding:11px 18px;border:0;border-radius:4px;background:#a98600;color:#fff;cursor:pointer}.error{padding:12px;background:#fdecec;border:1px solid #d99}.hidden{display:none}</style></head><body><main class="wrap"><h1>Conferência dos documentos</h1><p>Confira os dados identificados antes de prosseguir. Divergências devem ser decididas pelo responsável.</p><div id="loading">Carregando dados...</div><section id="content" class="hidden"><div class="card"><h2>Dados identificados</h2><div id="dados"></div></div><div class="card"><h2>Divergências</h2><div id="divergencias"></div></div><div class="card"><button id="confirmar">Confirmar e continuar</button></div></section><div id="erro" class="error hidden"></div></main><script type="module">const url=window.SUPABASE_URL,key=window.SUPABASE_ANON_KEY,id=sessionStorage.getItem('solicitacao_id');const loading=document.getElementById('loading'),content=document.getElementById('content'),dadosEl=document.getElementById('dados'),divEl=document.getElementById('divergencias'),erro=document.getElementById('erro');function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}async function get(path){const r=await fetch(`${url}/rest/v1/${path}`,{headers:{apikey:key,Authorization:`Bearer ${key}`}});if(!r.ok)throw Error(await r.text());return r.json()}async function run(){try{if(!id)throw Error('Solicitação não encontrada.');const docs=await get(`solicitacao_documentos?solicitacao_id=eq.${id}&select=*`);const fields={};for(const d of docs){const x=d.dados_extraidos||{};for(const [k,v] of Object.entries(x)){if(!fields[k])fields[k]=[];fields[k].push({v,doc:d.nome_original})}}let html='';for(const [k,vals] of Object.entries(fields)){const uniq=[...new Set(vals.map(x=>JSON.stringify(x.v)))];const cls=uniq.length>1?'warn':'ok';html+=`<div class="item ${cls}"><b>${esc(k)}</b>${vals.map(x=>`<div class="row"><span>${esc(x.doc)}</span><span>${esc(x.v)}</span></div>`).join('')}${uniq.length>1?'<div><b>⚠ Divergência: confira qual informação está correta.</b></div>':''}</div>`}dadosEl.innerHTML=html||'<p>Nenhum dado estruturado foi extraído ainda.</p>';const diverg=Object.entries(fields).filter(([,v])=>new Set(v.map(x=>JSON.stringify(x.v))).size>1);divEl.innerHTML=diverg.length?diverg.map(([k,v])=>`<div class="item bad"><b>${esc(k)}</b><p>${v.map(x=>`${esc(x.doc)}: ${esc(x.v)}`).join(' | ')}</p></div>`).join(''):'<p>✓ Nenhuma divergência encontrada.</p>';loading.classList.add('hidden');content.classList.remove('hidden')}catch(e){loading.classList.add('hidden');erro.textContent=e.message;erro.classList.remove('hidden')}}document.getElementById('confirmar').onclick=async()=>{try{const r=await fetch(`${url}/rest/v1/solicitacoes_contratacao?id=eq.${id}`,{method:'PATCH',headers:{apikey:key,Authorization:`Bearer ${key}`,'Content-Type':'application/json'},body:JSON.stringify({status:'pronto_para_gerar'})});if(!r.ok)throw Error(await r.text());alert('Conferência registrada. Próxima etapa: geração dos documentos.')}catch(e){erro.textContent=e.message;erro.classList.remove('hidden')}};run();</script></body></html>
