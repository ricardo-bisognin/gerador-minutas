<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gerar documentos</title><style>body{font-family:Arial,sans-serif;background:#f4f4f2;color:#222;margin:0}.wrap{max-width:900px;margin:40px auto;padding:0 20px}.card{background:#fff;border:1px solid #ddd;border-radius:6px;padding:26px;margin:18px 0}button{padding:12px 20px;border:0;border-radius:4px;background:#a98600;color:#fff;cursor:pointer}.doc{padding:14px;border:1px solid #ddd;margin:8px 0;border-radius:5px}.ok{color:#28784a}.error{padding:12px;background:#fdecec;border:1px solid #d99}</style></head><body><main class="wrap"><h1>Documentos da contratação</h1><p>Confira o pacote que será gerado.</p><section class="card"><div class="doc">📄 Carta Proposta <span class="ok">pronta para geração</span></div><div class="doc">📄 Termo de Cooperação <span class="ok">pronto para geração</span></div><div class="doc">📄 Plano de Trabalho — Anexo I <span class="ok">pronto para geração</span></div><div id="just" class="doc">📄 Justificativa de vigência <span class="ok">será incluída se aplicável</span></div></section><section class="card"><button id="gerar">Gerar pacote</button><div id="status"></div></section></main><script>const status=document.getElementById('status');document.getElementById('gerar').onclick=()=>{status.className='ok';status.style.marginTop='18px';status.textContent='Pacote preparado. A próxima implementação conectará os templates oficiais e produzirá os arquivos DOCX/PDF.'};</script></body></html>
