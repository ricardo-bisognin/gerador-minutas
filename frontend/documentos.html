<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gerador de Minutas — Documentos</title>
<style>body{font-family:Arial,sans-serif;background:#f4f4f2;color:#222;margin:0}.wrap{max-width:900px;margin:40px auto;padding:0 20px}.card{background:#fff;padding:28px;margin:18px 0;border:1px solid #ddd;border-radius:6px}.drop{border:2px dashed #aaa;border-radius:8px;padding:48px 20px;text-align:center;cursor:pointer}.drop.drag{background:#faf6df;border-color:#a98600}.drop input{display:none}.files{margin-top:18px}.file{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #eee}.status{padding:12px;margin-top:16px;border-radius:5px}.ok{background:#e9f7ef;border:1px solid #8bc9a4}.err{background:#fdecec;border:1px solid #d99}.hint{color:#666;font-size:14px}.btn{padding:12px 20px;border:0;border-radius:4px;cursor:pointer}.primary{background:#a98600;color:#fff}.actions{text-align:right;margin-top:18px}</style></head>
<body><main class="wrap"><h1>Documentos da solicitação</h1><p>Envie os documentos que comprovam a qualificação da entidade e de seu representante. O sistema fará a leitura e depois apresentará os dados para conferência.</p>
<section class="card"><h2>Envie os arquivos</h2><div class="drop" id="drop"><input id="files" type="file" multiple accept=".pdf,.jpg,.jpeg,.png,.webp"><strong>Arraste os documentos para cá</strong><br>ou clique para selecionar<br><span class="hint">PDF, JPG, JPEG, PNG ou WEBP</span></div><div id="filesList" class="files"></div><div id="status" class="status" hidden></div><div class="actions"><button class="btn primary" id="enviar" disabled>Enviar documentos</button></div></section></main>
<script src="config.js"></script><script type="module">
import { uploadDocumentos } from './api.js';
const input=document.getElementById('files'),drop=document.getElementById('drop'),list=document.getElementById('filesList'),status=document.getElementById('status'),btn=document.getElementById('enviar');let selected=[];
function render(){list.innerHTML=selected.map((f,i)=>`<div class="file"><span>${f.name}</span><button type="button" data-i="${i">Remover</button></div>`).join('');btn.disabled=!selected.length;list.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{selected.splice(Number(b.dataset.i),1);render()})}
function add(files){selected=[...selected,...files].filter((f,i,a)=>a.findIndex(x=>x.name===f.name&&x.size===f.size)===i);render()}
input.onchange=e=>add([...e.target.files]);drop.onclick=()=>input.click();drop.ondragover=e=>{e.preventDefault();drop.classList.add('drag')};drop.ondragleave=()=>drop.classList.remove('drag');drop.ondrop=e=>{e.preventDefault();drop.classList.remove('drag');add([...e.dataTransfer.files])};
function msg(cls,text){status.className='status '+cls;status.textContent=text;status.hidden=false}
btn.onclick=async()=>{const id=sessionStorage.getItem('solicitacao_id');if(!id){msg('err','Não encontramos a solicitação. Volte à etapa anterior e crie uma nova solicitação.');return}btn.disabled=true;btn.textContent='Enviando...';try{for(const file of selected)await uploadDocumentos(id,file);msg('ok',`${selected.length} documento(s) enviado(s). O próximo passo será a leitura e extração dos dados.`);selected=[];render()}catch(e){msg('err',e.message||'Não foi possível enviar os documentos.')}finally{btn.disabled=!selected.length;btn.textContent='Enviar documentos'}};
</script></body></html>
